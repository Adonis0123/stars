<!DOCTYPE html>
<html lang="zh-CN" data-lt-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="Stars">收藏</title>
<style>
/*
 * Local Tools shared UI: one source for every Portal page (core/portal-tools.ts).
 * Served on every surface at /_shared/local-tools.css. Pages link it before
 * their own <style>, so page rules may still override where a page truly differs.
 * Shared rules read only --lt-* tokens; page-local variables never leak in here.
 */
:root {
  /* Kit tokens (docs/portal-architecture.md §5.1): sideby's PanelThemeTokens names in kebab case
     (--kit-font-size is fontSize). They are the source; the sideby Panel's theme is read from them
     by name (core/accounts-surface.ts), and the --lt-* tokens below that mean the same thing are
     aliases of them. Values may use the --lt-* scale (weights). */
  --kit-font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --kit-font-size: 14px;
  --kit-small-size: 12px;
  --kit-control-size: 13px;
  --kit-heading-size: 16px;
  --kit-large-size: var(--kit-heading-size);
  --kit-title-size: 20px;
  --kit-title-weight: var(--lt-weight-strong);
  --kit-heading-weight: var(--lt-weight-strong);
  --kit-strong-weight: var(--lt-weight-strong);
  --kit-button-weight: var(--lt-weight-medium);
  --kit-primary-weight: var(--lt-weight-medium);
  /* Colors: the design system's "Teal" theme, the default (brand repo design-system/, 2026-10-24). Between
     brand:light and brand:end the values are generated from design-system/tokens.json by
     scripts/sync-brand-theme.ts; change the brand files and rerun it, never edit the hex here. */
  /* brand:light */
  --kit-bg: #F9F9FB;
  --kit-surface: #FCFCFD;
  --kit-surface-muted: #F0F0F3;
  --kit-border: #E0E1E6;
  --kit-border-strong: #D9D9E0;
  --kit-text: #1C2024;
  --kit-muted: #60646C;
  --kit-faint: #8B8D98;
  --kit-hover: #F9F9FB;
  --kit-active: #E8E8EC;
  --kit-accent: #04706D;
  --kit-accent-soft: #E3F2F2;
  --kit-focus: #37A29D;
  --kit-primary: #0E8C88;
  --kit-primary-hover: #2B9A96;
  --kit-primary-active: #2B9A96;
  --kit-on-primary: #FFFFFF;
  --kit-primary-border: #0E8C88;
  --kit-primary-hover-border: #2B9A96;
  --kit-button-text: #1C2024;
  --kit-button-hover-border: #CDCED6;
  --kit-ok: #1C2024;
  --kit-ok-soft: #DAEEDF;
  --kit-warn: #A44D00;
  --kit-warn-soft: #FAF0CA;
  --kit-fail: #641723;
  --kit-fail-soft: #F9E2E2;
  --kit-ok-bar: #27A644;
  --kit-warn-bar: #F0BF00;
  --kit-fail-bar: #EB5757;
  --kit-track: #E8E8EC;
  --kit-logo-bg: #E3F2F2;
  --kit-logo-border: #E0E1E6;
  --lt-popover: #FCFCFD;
  --lt-sidebar: #F9F9FB;
  --lt-brand: #2BA5A0;
  --lt-soft-fg: #04706D;
  --lt-nav-active: #DAECED;
  --lt-tint: #E3F2F2;
  --lt-tint-line: #37A29D;
  --lt-ring-halo: #C1E1E0;
  --lt-danger-line: #F7CACB;
  --lt-warn-bar: #F0BF00;
  --lt-tooltip: #1C2024;
  --lt-tooltip-fg: #FCFCFD;
  --lt-shadow-tint: #1C2024;
  --lt-primary-glow: 0 12px 26px -14px #A7E4E0;
  /* brand:end */
  --kit-focus-outline: none;
  --kit-focus-ring: 0 0 0 3px var(--lt-ring-halo);
  /* Secondary buttons only change their fill on hover. */
  --kit-button-hover-text: var(--kit-button-text);
  --kit-check-color: var(--kit-focus);
  /* The buddies never follow the theme: the sideby mark keeps its blue body. */
  --kit-logo-color: #3f8fc4; /* design-system-ignore: the sideby mark's fixed brand blue, not a theme color */
  /* The swatch beside each Colors choice in Settings (generated: each palette's light main button). */
  /* brand:swatches */
  --lt-swatch-teal: #0E8C88;
  --lt-swatch-leaf: #568C11;
  --lt-swatch-celeste: #0182D3;
  --lt-swatch-claude: #DE4E13;
  --lt-swatch-codex: #0D0D0D;
  /* brand:end */
  /* Code blocks (Blog articles): highlighted with a dark code theme, so they stay a dark surface; in dark mode the
     dark blocks below make it the quiet step between page and card. */
  --lt-code-bg: var(--lt-tooltip);
  --lt-code-fg: var(--lt-tooltip-fg);
  /* The check on the selected Colors dot. Every dot is a palette's light main button, dark enough for white text, so the
     check stays near-white in both modes: the light surface here, the light text color in the dark blocks. */
  --lt-on-swatch: var(--lt-surface);
  --kit-shadow: none;
  --kit-radius: 10px;
  --kit-control-radius: 6px;
  --kit-chip-radius: 4px;
  /* Control heights (design system: md 28 / lg 32). */
  --kit-control-height: 32px;
  --kit-control-height-small: 28px;
  --kit-field-height: var(--kit-control-height);
  --kit-content-width: none;
  --kit-gutter: max(24px, calc((100vw - 1480px) / 2));

  --lt-font: var(--kit-font);
  /* Type weights (design system): text 400; buttons, table heads and current items 500; titles and 11px uppercase labels 600. */
  --lt-weight-regular: 400;
  --lt-weight-medium: 500;
  --lt-weight-strong: 600;
  --lt-weight-label: 600;
  /* Type scale (px, design system): label 11 · meta 12 · control 13 · body 14 · title 16 · section 20 · page 20 · display 20.
     Shared rules write the px value itself (the spec check reads literal sizes); these names stay for the pages. */
  --lt-size-label: 11px;
  --lt-size-meta: var(--kit-small-size);
  --lt-size-control: var(--kit-control-size);
  --lt-size-body: var(--kit-font-size);
  --lt-size-title: var(--kit-heading-size);
  --lt-size-section: 20px;
  --lt-size-page: var(--kit-title-size);
  --lt-size-display: 20px;
  --lt-text: var(--kit-text);
  --lt-muted: var(--kit-muted);
  --lt-page: var(--kit-bg);
  --lt-surface: var(--kit-surface);
  --lt-surface-quiet: var(--kit-surface-muted);
  --lt-soft: var(--kit-accent-soft);
  --lt-soft-strong: var(--kit-active);
  /* The strong accent for text, sort arrows and tab underlines: the link color. Focus has its own --kit-focus (in the
     Codex theme the only blue on the page). */
  --lt-brand-strong: var(--kit-accent);
  --lt-brand-ink: var(--kit-accent);
  --lt-ink: var(--kit-text);
  --lt-line: var(--kit-border);
  --lt-line-strong: var(--kit-border-strong);
  --lt-danger: var(--kit-fail);

  --lt-radius: var(--kit-control-radius);
  --lt-radius-panel: var(--kit-radius);
  /* Main buttons are pills (design system radius.pill, button rule 2026-10-25). */
  --lt-radius-pill: 9999px;
  --lt-control-height: var(--kit-control-height);
  --lt-shell-gutter: var(--kit-gutter);
  --lt-nav-height: 48px;
  --lt-header-height: 84px;

  /* State rules: hover is a neutral wash; selected is the pale accent fill with accent text, no outline, weight 500
     (design-system README, rule 4); focus recolors the border and adds a soft halo. */
  --lt-hover-tint: var(--kit-hover);
  --lt-press-tint: var(--kit-active);
  --lt-selected-bg: var(--lt-soft);
  --lt-selected-fg: var(--lt-soft-fg);
  --lt-selected-line: transparent;
  --lt-btn-bg: var(--lt-surface);
  --lt-btn-line: var(--lt-line-strong);
  --lt-btn-fg: var(--kit-button-text);
  --lt-btn-hover-bg: var(--lt-hover-tint);
  --lt-btn-hover-line: var(--kit-button-hover-border);
  --lt-btn-hover-fg: var(--kit-button-hover-text);
  --lt-btn-active-bg: var(--lt-press-tint);
  --lt-focus-halo: var(--kit-focus-ring);
  --lt-danger-bg: var(--kit-fail-soft);
  --lt-control-height-sm: var(--kit-control-height-small);
  /* Segmented control: white track so the pale leaf selected item stands out. */
  --lt-seg-track: var(--lt-surface);
  --lt-seg-track-line: var(--lt-line-strong);
  --lt-primary-bg: var(--kit-primary);
  --lt-primary-fg: var(--kit-on-primary);
  --lt-primary-line: var(--kit-primary-border);
  --lt-primary-hover-bg: var(--kit-primary-hover);
  --lt-primary-hover-line: var(--kit-primary-hover-border);
  --lt-primary-active-bg: var(--kit-primary-active);
  --lt-primary-active-line: var(--kit-primary-hover-border);
  --lt-focus-ring: 2px solid var(--kit-focus);
  --lt-transition: background-color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);

  /* Design-system names (brand repo design-system/components/tokens.css) for the shared rules and any page that
     follows the component library: motion, radii, and the selected / current-item roles as aliases of the theme. */
  --duration-fast: 120ms;
  --duration-base: 160ms;
  --duration-slow: 200ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 10px;
  --radius-pill: 9999px;
  --selected: var(--lt-selected-bg);
  --accent-foreground: var(--lt-selected-fg);
  --nav-active: var(--lt-nav-active);
  --nav-active-foreground: var(--lt-soft-fg);
}

/* Dark values. Only a page that opts in follows them: <html data-lt-theme="auto"> follows the system,
   data-lt-theme="dark" forces them. Page and sidebar share the darkest step, cards sit one big step
   lighter, links one step brighter (theme.json dark roles). The two blocks below must stay
   identical (tests/portal-tools.test.ts); scripts/sync-brand-theme.ts writes both. */

  color-scheme: dark;

  --kit-on-primary: #FFFFFF;
  --kit-primary-border: #0E8C88;
  --kit-primary-hover-border: #2B9A96;
  --kit-button-text: #EDEEF0;
  --kit-button-hover-border: #43484E;
  --kit-ok: #EDEEF0;
  --kit-ok-soft: #22372A;
  --kit-warn: #FFCA16;
  --kit-warn-soft: #4A411E;
  --kit-fail: #FF9592;
  --kit-fail-soft: #412A2D;
  --kit-ok-bar: #27A644;
  --kit-warn-bar: #F0BF00;
  --kit-fail-bar: #EB5757;
  --kit-track: #2E3135;
  --kit-logo-bg: #253D3F;
  --kit-logo-border: #2E3135;
  --lt-popover: #212225;
  --lt-sidebar: #111113;
  --lt-brand: #34ABA6;
  --lt-soft-fg: #89C7C3;
  --lt-nav-active: #193636;
  --lt-tint: #253D3F;
  --lt-tint-line: #289591;
  --lt-ring-halo: #223738;
  --lt-danger-line: #5E3234;
  --lt-warn-bar: #F0BF00;
  --lt-tooltip: #EDEEF0;
  --lt-tooltip-fg: #111113;
  --lt-shadow-tint: #000000;
  --lt-primary-glow: none;
  /* brand:end */
}

    color-scheme: dark;

.local-tools-swatch[data-palette="teal"] { background: var(--lt-swatch-teal) }
.local-tools-swatch[data-palette="leaf"] { background: var(--lt-swatch-leaf) }
.local-tools-swatch[data-palette="celeste"] { background: var(--lt-swatch-celeste) }
.local-tools-swatch[data-palette="claude"] { background: var(--lt-swatch-claude) }
.local-tools-swatch[data-palette="codex"] { background: var(--lt-swatch-codex) }
/* brand:end */

/* A switch of mode or colors snaps: the design system does not animate theme or light/dark changes (README 动效). */

/* Keep the page width stable across surfaces so the shared nav never shifts when switching. */
html { scrollbar-gutter: stable; scroll-padding-top: calc(var(--lt-nav-height) + 12px) }

/* Page skeleton: body type base and the top-level content shell share the nav/header gutter.
   :where() keeps both at zero specificity so page rules (padding, grid layout) still win. */
body { font-family: var(--lt-font); font-size: 16px; font-weight: 400; line-height: 1.5; font-variant-numeric: tabular-nums }
:where(.lt-shell, body > main) { margin-inline: var(--lt-shell-gutter) }

/* Tool navigation: a left sidebar (core/web-surfaces.ts, DESIGN.md 2026-10-18). Blue marks only the current page;
   hover stays neutral. It is fixed, so switching surfaces never needs a scroll back to the top; the page keeps clear
   of it with padding, and --lt-nav-height drops to 0 because nothing sits above the page any more.
   Collapsing and expanding move the width, and the page follows (DESIGN.md 2026-11-17, see "Moving" below).
   Widths: 220px expanded; a 56px icon rail when collapsed (⌘B, saved) or narrower than 1100px, where the collapse
   button opens it over the page instead; below 680px a 48px top bar whose menu button opens it as a drawer. */
:root { --lt-sidebar-width: 220px; --lt-rail-width: 56px; --lt-nav-in: 300ms; --lt-nav-out: 250ms; --lt-nav-ease: cubic-bezier(.2, 0, 0, 1) }
:root:has(.local-tools-nav) { --lt-nav-height: 0px; --lt-nav-width: var(--lt-sidebar-width) }
:root:has(.local-tools-nav[data-collapsed]) { --lt-nav-width: var(--lt-rail-width) }
body:has(.local-tools-nav) { padding-left: var(--lt-nav-width) }
.local-tools-nav { position: fixed; inset: 0 auto 0 0; z-index: 30; box-sizing: border-box; width: var(--lt-nav-width); display: flex; flex-direction: column; border-right: 1px solid var(--lt-line); background: var(--lt-sidebar); font-family: var(--lt-font); line-height: 1.5; container: lt-nav / inline-size }
.local-tools-nav *, .local-tools-nav *::before, .local-tools-nav *::after { box-sizing: border-box }
/* Icons are neutral; only the current item's icon takes the accent (design-system README: accent only on points). */
.local-tools-glyph { flex: 0 0 18px; color: var(--lt-muted) }
.local-tools-nav a[aria-current="page"] .local-tools-glyph { color: inherit }
.local-tools-head { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 8px 8px 20px }
.local-tools-label { flex: 1 1 auto; min-width: 0; overflow: hidden; color: var(--lt-muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap }
.local-tools-head button { flex: 0 0 auto; display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: var(--radius-md); color: var(--lt-muted); background: transparent; cursor: pointer; transition: var(--lt-transition) }
.local-tools-head button:hover { color: var(--lt-text); background: var(--lt-hover-tint) }
.local-tools-menu, .local-tools-current { display: none !important }
.local-tools-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 4px; padding: 4px 8px 8px; overflow-y: auto; overflow-x: hidden }
.local-tools-group { display: flex; flex-direction: column; gap: 4px; margin-top: 16px }
.local-tools-group[hidden] { display: none }
.local-tools-group-title { padding: 0 12px 4px; color: var(--lt-muted); font-size: 11px; font-weight: 500; white-space: nowrap }
.local-tools-nav a, .local-tools-settings-btn { position: relative; width: 100%; min-height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; border-radius: var(--radius-md); color: var(--lt-muted); background: transparent; font-family: var(--lt-font); font-size: 13px; font-weight: 500; line-height: 1.5; text-align: left; text-decoration: none; white-space: nowrap; cursor: pointer; transition: var(--lt-transition) }
.local-tools-nav a:not([aria-current="page"]):hover, .local-tools-settings-btn:hover, .local-tools-settings-btn[aria-expanded="true"] { color: var(--lt-text); background: var(--lt-hover-tint) }
.local-tools-nav a:not([aria-current="page"]):active { background: var(--lt-press-tint) }
/* Current item: the accent's nav tint with accent text, no side bar (design-system README, rule 4). */
.local-tools-nav a[aria-current="page"] { color: var(--nav-active-foreground); background: var(--nav-active); font-weight: 500 }
/* Every control in the nav gets a solid 2px ring: the shared halo is too faint on the sidebar's surface. */
.local-tools-nav :is(a, button):focus-visible { outline: 2px solid var(--kit-focus); outline-offset: -2px; box-shadow: none }
.local-tools-text { min-width: 0; overflow: hidden; text-overflow: ellipsis }
/* Each tab leads with its page icon (core/web-icon.ts, served on every host at /_shared/icons/<id>.svg);
   the nav renders it as an <img>, so a page added in portal.json needs no rule here. */
.local-tools-icon { flex: 0 0 20px; width: 20px; height: 20px }
/* A Tool's row: its link, and a pin at the end that moves it into or out of Pinned. The pin shows on hover and
   keyboard focus (always, faintly, on a touch screen); the link keeps room for it, so the dot never sits under it. */
.local-tools-row { position: relative; display: flex }
.local-tools-row > a { flex: 1 1 auto; padding-right: 32px }
/* Centred without a transform: the Kit's pressed-button nudge (translateY(1px)) would replace it and move the pin away
   from the pointer between press and release, so the click would land on the link. */
.local-tools-pin, .local-tools-pin:active { position: absolute; top: calc(50% - 12px); right: 4px; display: inline-grid; place-items: center; width: 24px; height: 24px; min-height: 0; padding: 0; border: 0; border-radius: var(--radius-sm); color: var(--lt-muted); background: transparent; opacity: 0; transform: none; cursor: pointer; transition: var(--lt-transition) }
.local-tools-pin .local-tools-glyph { width: 14px; height: 14px }
.local-tools-row:hover .local-tools-pin, .local-tools-pin:focus-visible { opacity: 1 }
.local-tools-pin:hover { color: var(--lt-text); background: var(--lt-hover-tint) }
/* Outline in both states (2026-11-01): a filled pin read as a heavy grey block. Pinned rows show it in the accent. */
.local-tools-pin[aria-pressed="true"] { color: var(--accent-foreground) }
@media (hover: none) { .local-tools-pin { opacity: .55 } }
/* Dragging a row to reorder: it stays in place as a faded copy, and an empty group shows as a drop area. */
.local-tools-row.local-tools-dragging { opacity: .4 }
.local-tools-group[data-drop] { min-height: 64px; border: 1px dashed var(--lt-line-strong); border-radius: var(--radius-md) }

/* Settings, at the bottom: a small menu that holds the language switch. */
.local-tools-settings { position: relative; margin-top: auto; padding-top: 8px }
/* Fixed, not absolute: .local-tools-body clips overflow, so a wider menu (long labels, larger fonts) would be cut at the nav edge. 44px = the Settings button's 40px from the window bottom + 4px. */
.local-tools-settings-menu { position: fixed; left: 8px; bottom: 44px; z-index: 40; width: max-content; min-width: 240px; padding: 12px; border: 1px solid var(--lt-line); border-radius: var(--radius-xl); background: var(--lt-surface); box-shadow: 0 10px 28px color-mix(in srgb, var(--lt-shadow-tint) 14%, transparent) }
.local-tools-settings-menu[hidden] { display: none }
/* Under the nav (z-index 30), over the page and any embedded Panel: a click outside the open Settings menu only closes it. */
.local-tools-scrim { position: fixed; inset: 0; z-index: 29; background: transparent }
.local-tools-scrim[hidden] { display: none }
.local-tools-menu-title { display: block; margin: 0 0 4px; color: var(--lt-muted); font-size: 12px }
.local-tools-settings-menu > :is(.local-tools-lang, .local-tools-palettes) + .local-tools-menu-title { margin-top: 12px }
/* Reserve the deadline width even while off, so toggling never resizes the popover. */
.local-tools-unattended-until { display: inline-block; width: 11ch; margin-left: 4px; color: var(--lt-muted); font-variant-numeric: tabular-nums; white-space: nowrap }

/* Moving (after Chrome's vertical tabs and ChatGPT): a switch the user makes moves the width, 300ms opening and 250ms
   closing, quick start and soft landing, and the page's left padding follows. local-tools.js sets data-moving ("in"
   opening, "out" closing) for that time only, so the first render and a window crossing 1100px switch at once.
   Meanwhile the list keeps the expanded 220px layout and the moving edge clips it; the names fade (out in the first
   100ms, in over the last 160ms), so no half word slides by. The collapse button rides the edge: the head's padding
   moves into the label's indent, which can shrink to nothing, so the button lands exactly where the rail puts it.
   The rail's own rules below wait: they apply once a collapse is done and are gone from the first frame of an expand. */
.local-tools-nav[data-moving] { overflow: hidden }
.local-tools-nav[data-moving="in"] { transition: width var(--lt-nav-in) var(--lt-nav-ease), box-shadow var(--lt-nav-in) var(--lt-nav-ease) }
.local-tools-nav[data-moving="out"] { transition: width var(--lt-nav-out) var(--lt-nav-ease), box-shadow var(--lt-nav-out) var(--lt-nav-ease) }
body:has(.local-tools-nav[data-moving="in"]) { transition: padding-left var(--lt-nav-in) var(--lt-nav-ease) }
body:has(.local-tools-nav[data-moving="out"]) { transition: padding-left var(--lt-nav-out) var(--lt-nav-ease) }
.local-tools-nav[data-moving] .local-tools-body { min-width: var(--lt-sidebar-width) }
/* 7px + the 8px gap + the 32px button + 8px = the rail's 55px inside its 1px border. */
.local-tools-nav[data-moving] .local-tools-head { padding-left: 7px }
.local-tools-nav[data-moving] .local-tools-label { text-indent: 13px }
/* An embedded Panel holds its wider width while the sidebar moves (local-tools.js holdFrames); the window clips it. */
:root:has(.local-tools-nav[data-moving]) { overflow-x: clip }
.local-tools-nav[data-moving="out"] :is(.local-tools-text, .local-tools-label, .local-tools-group-title) { animation: lt-nav-fade-out 100ms linear both }
.local-tools-nav[data-moving="in"] :is(.local-tools-text, .local-tools-label, .local-tools-group-title) { animation: lt-nav-fade-in 160ms var(--lt-nav-ease) 140ms both }
@keyframes lt-nav-fade-out { to { opacity: 0 } }
@keyframes lt-nav-fade-in { from { opacity: 0 } }

/* Hover peek (Chrome's vertical tabs): resting the mouse on the rail opens the sidebar over the page, which stays put;
   the shadow says it floats. Clicking collapse (or the edge, or ⌘B) while it is open keeps it open. */
.local-tools-nav[data-peek] { width: var(--lt-sidebar-width); box-shadow: 0 16px 48px color-mix(in srgb, var(--lt-shadow-tint) 18%, transparent) }

/* The right edge (after shadcn/ui's SidebarRail): a 9px strip over the border that shows a 2px line on hover and
   collapses or expands the sidebar on a click; the cursor points the way it will go. */
.local-tools-nav .local-tools-edge[data-tip] { position: absolute; top: 0; bottom: 0; right: -5px; z-index: 2; width: 9px; min-height: 0; padding: 0; border: 0; background: transparent; transform: none; cursor: w-resize }
.local-tools-nav:is([data-collapsed], [data-peek]) .local-tools-edge[data-tip] { cursor: e-resize }
.local-tools-edge::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: var(--lt-line-strong); opacity: 0; transition: opacity var(--duration-fast) var(--ease-out) }
.local-tools-edge:hover::after { opacity: 1 }

/* Reduced motion: local-tools.js never sets data-moving, so the sidebar switches at once and nothing here runs. */

/* The icon rail: collapsed, or narrower than 1100px (not while it is moving, see above). It follows the nav's own
   width, so one set of rules serves both. Every icon, the collapse button and each row keep the expanded sidebar's
   position and height, so nothing jumps when the layout swaps: icons stay 19px from the left edge, the collapse
   button stays at the right edge, and a group's title keeps its box and draws a line in place of its text. */
@container lt-nav (max-width: 119px) {
  .local-tools-nav:not([data-moving]) .local-tools-head { justify-content: flex-end; padding-left: 0 }
  .local-tools-nav:not([data-moving]) .local-tools-label { display: none }
  /* The names leave the screen but stay the links' names for a screen reader. */
  .local-tools-nav:not([data-moving]) .local-tools-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
  .local-tools-nav:not([data-moving]) .local-tools-body { scrollbar-width: none }
  .local-tools-nav:not([data-moving]) .local-tools-group-title { overflow: hidden; color: transparent; background: linear-gradient(var(--lt-line), var(--lt-line)) center 40% / calc(100% - 12px) 1px no-repeat }
  .local-tools-nav:not([data-moving]) .local-tools-dot { position: absolute; top: 5px; right: 6px; margin: 0 }
  .local-tools-nav:not([data-moving]) .local-tools-row > a { padding-right: 0 }
  .local-tools-nav:not([data-moving]) .local-tools-pin { display: none }
  /* Out of the scrolling list, which would clip it: the rail is pinned to the window's left edge. */
  .local-tools-nav:not([data-moving]) .local-tools-settings-menu { position: fixed; left: calc(var(--lt-rail-width) + 8px); bottom: 10px }
}

/* Segmented switches in Settings (language, mode, notify, unattended, memory guard; core/web-surfaces.ts), drawn like
   the design system's segmented control: an outlined 28px track with no inner padding; each item keeps a transparent
   1px border so its fill sits 1px in (2px apart from the next); the selected one is the soft accent fill with accent
   text, no ring and no heavier weight (brand repo design-system/components/segmented/segmented.css). */
.local-tools-lang { flex: 0 0 auto; display: inline-flex; align-items: stretch; gap: 0; height: 28px; padding: 0; border: 1px solid var(--lt-line-strong); border-radius: var(--radius-md); background: var(--lt-surface) }
.local-tools-lang button { flex: none; min-width: 36px; min-height: 0; padding: 0 12px; border: 1px solid transparent; border-radius: var(--radius-sm); background-clip: padding-box; color: var(--lt-muted); background-color: transparent; font-family: var(--lt-font); font-size: 13px; font-weight: 500; line-height: 1; white-space: nowrap; cursor: pointer; transition: var(--lt-transition) }
.local-tools-lang button[aria-pressed="true"] { color: var(--accent-foreground); background-color: var(--selected); cursor: default }
.local-tools-lang button[aria-pressed="false"]:hover:not(:disabled) { color: var(--lt-text); background-color: var(--lt-hover-tint) }
.local-tools-lang button:disabled { cursor: progress; opacity: .6 }
/* Colors: every theme as a 28px dot in one row (a radio group); the one in use carries a near-white check (--lt-on-swatch),
   with no ring around it (design-system README, rule 4); the name is in its tooltip. The hairline keeps a black or white
   dot visible on a menu of the same color. */
.local-tools-palettes { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; padding: 4px }
.local-tools-swatch { position: relative; flex: none; width: 28px; height: 28px; min-height: 0; padding: 0; border: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lt-text) 18%, transparent); cursor: pointer; transition: transform var(--duration-fast) var(--ease-out) }
.local-tools-swatch:hover:not(:disabled) { transform: scale(1.08) }
.local-tools-swatch[aria-checked="true"] { cursor: default }
.local-tools-swatch[aria-checked="true"]::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--lt-on-swatch); font-family: var(--lt-font); font-size: 14px; font-weight: 600; line-height: 1 }
.local-tools-swatch:disabled { cursor: progress }
.local-tools-swatch:focus-visible { outline: 2px solid var(--kit-focus); outline-offset: 3px }
.local-tools-lang button:focus-visible { border-color: var(--kit-focus); outline: none; box-shadow: var(--lt-focus-halo) }

/* While the sidebar is open over the page, the page stays put (local-tools.js also makes it inert). */
:root:has(.local-tools-nav[data-open]) { overflow: hidden }

/* Narrower than 1100px the page keeps its width: the sidebar is a rail, and the collapse button (or ⌘B) opens it to
   220px over the page until a click outside, Escape or a page switch. 1100px leaves an expanded sidebar ~880px of page. */
@media (max-width: 1099px) {
  :root:has(.local-tools-nav), :root:has(.local-tools-nav[data-collapsed]) { --lt-nav-width: var(--lt-rail-width) }
  .local-tools-nav[data-open] { width: var(--lt-sidebar-width); box-shadow: 0 16px 48px color-mix(in srgb, var(--lt-shadow-tint) 18%, transparent) }
  .local-tools-nav:not([data-open]) .local-tools-edge[data-tip] { cursor: e-resize }
  .local-tools-nav[data-open]::after { content: ""; position: fixed; inset: 0 0 0 var(--lt-sidebar-width); z-index: -1; background: color-mix(in srgb, var(--lt-shadow-tint) 18%, transparent) }
}

/* Below 680px: a 48px top bar with the menu button and the current page; the sidebar opens under it as a drawer,
   so the same button closes it. */
@media (max-width: 679px) {
  :root:has(.local-tools-nav), :root:has(.local-tools-nav[data-collapsed]) { --lt-nav-width: 0px; --lt-nav-height: 48px }
  .local-tools-nav, .local-tools-nav[data-open] { position: sticky; inset: auto; top: 0; width: auto; height: var(--lt-nav-height); border-right: 0; border-bottom: 1px solid var(--lt-line); box-shadow: none }
  .local-tools-head { min-height: 47px; justify-content: flex-start; gap: 8px; padding: 8px 12px 8px 8px }
  .local-tools-menu { display: inline-grid !important }
  /* The menu button shows a cross while the drawer is open, since it closes it. */
  .local-tools-menu .local-tools-glyph { grid-area: 1 / 1 }
  .local-tools-menu .local-tools-glyph + .local-tools-glyph, .local-tools-nav[data-open] .local-tools-menu .local-tools-glyph:first-child { display: none }
  .local-tools-nav[data-open] .local-tools-menu .local-tools-glyph + .local-tools-glyph { display: block }
  .local-tools-label, .local-tools-collapse, .local-tools-edge { display: none !important }
  .local-tools-current { display: flex !important; align-items: center; gap: 8px; min-width: 0; overflow: hidden; color: var(--lt-text); font-size: 13px; font-weight: 500; white-space: nowrap }
  .local-tools-body { position: fixed; inset: var(--lt-nav-height) auto 0 0; z-index: 41; width: min(260px, 86vw); padding-top: 12px; border-right: 1px solid var(--lt-line); background: var(--lt-sidebar); box-shadow: 0 16px 48px color-mix(in srgb, var(--lt-shadow-tint) 18%, transparent); visibility: hidden; transform: translateX(-100%); transition: none }
  /* Visible at once on opening, so focus can move into it, then it slides in; closing does not animate (README 动效). */
  .local-tools-nav[data-open] .local-tools-body { visibility: visible; transform: none; transition: transform var(--duration-slow) var(--ease-out) }
  .local-tools-nav[data-open]::after { content: ""; position: fixed; inset: var(--lt-nav-height) 0 0; z-index: 40; background: color-mix(in srgb, var(--lt-shadow-tint) 28%, transparent) }
}

/* Tooltip (web/shared/local-tools.js): one fixed box for every [data-tip], so overflow never clips it. */
[data-tip] { cursor: help }
:is(button, a[href], label, select, input[type="checkbox"], summary, [role="button"])[data-tip] { cursor: pointer }
:is(button:disabled, [aria-busy="true"])[data-tip] { cursor: progress }
.lt-tip { position: fixed; z-index: 999; max-width: min(320px, calc(100vw - 24px)); padding: 8px 12px; border: 1px solid var(--lt-tooltip); border-radius: var(--radius-lg); background: var(--lt-tooltip); color: var(--lt-tooltip-fg); font-family: var(--lt-font); font-size: 12px; font-weight: 400; line-height: 1.5; letter-spacing: 0; text-transform: none; white-space: pre-line; text-align: left; box-shadow: 0 10px 28px color-mix(in srgb, var(--lt-shadow-tint) 22%, transparent); pointer-events: none; visibility: hidden; opacity: 0; transform: translateY(4px); transition: opacity var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out), visibility var(--duration-fast) }
.lt-tip.visible { visibility: visible; opacity: 1; transform: none }

/* App header: icon, title and one-line purpose on the left; status or actions on the right. */
.app-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 24px; width: 100%; min-height: var(--lt-header-height); margin: 0; padding: 16px var(--lt-shell-gutter); border: 0; border-bottom: 1px solid var(--lt-line); border-radius: 0; box-shadow: none; background: var(--lt-surface); font-family: var(--lt-font) }
.app-header .brand { display: flex; align-items: center; gap: 12px; min-width: 0; color: var(--lt-text); text-decoration: none }
.app-header .brand-copy { min-width: 0 }
.app-header h1 { margin: 0; color: var(--lt-text); font-size: 20px; font-weight: 600; line-height: 1.3; letter-spacing: -.025em }
.app-header .subtitle { display: block; margin: 4px 0 0; color: var(--lt-muted); font-size: 13px; font-weight: 400; line-height: 1.5 }
.app-header .workspace-note { color: var(--lt-muted); font-size: 13px; white-space: nowrap }
.app-header .mark { display: grid; place-items: center; flex: 0 0 40px; width: 40px; height: 40px; border-radius: var(--radius-xl); overflow: hidden }
.app-header .mark img { display: block; width: 40px; height: 40px }

/* Controls. Opt in with the classes below; every family shares the same state rules. */

/* Buttons: .lt-btn + optional .lt-btn-primary / -ghost / -danger, size .lt-btn-sm, square .lt-btn-icon. */
.lt-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--lt-control-height); padding: 0 16px; border: 1px solid var(--lt-btn-line); border-radius: var(--radius-md); color: var(--lt-btn-fg); background: var(--lt-btn-bg); font-family: var(--lt-font); font-size: 13px; font-weight: 500; line-height: 1.2; white-space: nowrap; cursor: pointer; transition: var(--lt-transition) }
.lt-btn:hover:not(:disabled) { border-color: var(--lt-btn-hover-line); color: var(--lt-btn-hover-fg); background: var(--lt-btn-hover-bg) }
.lt-btn:active:not(:disabled) { background: var(--lt-btn-active-bg) }
.lt-btn-primary { border-color: var(--lt-primary-line); border-radius: var(--radius-pill); color: var(--lt-primary-fg); background: var(--lt-primary-bg); font-weight: 500; box-shadow: var(--lt-primary-glow) }
.lt-btn-primary:hover:not(:disabled) { border-color: var(--lt-primary-hover-line); color: var(--lt-primary-fg); background: var(--lt-primary-hover-bg) }
.lt-btn-primary:active:not(:disabled) { border-color: var(--lt-primary-active-line); background: var(--lt-primary-active-bg) }
.lt-btn-ghost { border-color: transparent; color: var(--lt-brand-ink); background: transparent }
.lt-btn-ghost:hover:not(:disabled) { border-color: transparent; color: var(--lt-brand-ink); background: var(--lt-hover-tint) }
.lt-btn-ghost:active:not(:disabled) { background: var(--lt-press-tint) }
.lt-btn-danger { border-color: var(--lt-danger-line); color: var(--lt-danger); background: var(--lt-surface) }
.lt-btn-danger:hover:not(:disabled) { border-color: var(--lt-danger); color: var(--lt-danger); background: var(--lt-danger-bg) }
.lt-btn-danger:active:not(:disabled) { background: var(--lt-danger-line) }
/* Ghost danger: red text on a transparent ground; hover adds the pale red wash. Two classes beat the solid danger rules. */
.lt-btn-ghost.lt-btn-danger { border-color: transparent; color: var(--lt-danger); background: transparent }
.lt-btn-ghost.lt-btn-danger:hover:not(:disabled) { border-color: transparent; color: var(--lt-danger); background: var(--lt-danger-bg) }
.lt-btn-ghost.lt-btn-danger:active:not(:disabled) { border-color: transparent; background: var(--lt-danger-line) }
/* Controls written as links (a.lt-btn, a.lt-chip, …) look like their button form: no underline. */
:is(a.lt-btn, a.lt-chip, a.lt-seg-item, a.lt-list-item) { text-decoration: none }
.lt-btn-sm { min-height: var(--lt-control-height-sm); padding: 0 12px; font-size: 12px; font-weight: 500 }
.lt-btn-icon { width: var(--lt-control-height-sm); min-height: var(--lt-control-height-sm); padding: 0; border-color: transparent; color: var(--lt-muted); background: transparent; font-size: 16px }
.lt-btn-icon:hover:not(:disabled) { border-color: transparent; color: var(--lt-text); background: var(--lt-hover-tint) }
.lt-btn-icon:active:not(:disabled) { background: var(--lt-press-tint) }
.lt-btn:disabled, .lt-seg-item:disabled, .lt-chip:disabled { cursor: not-allowed; opacity: .5 }

/* Selectable families: segmented group, chips, sidebar list items and underline tabs.
   Selected = [aria-pressed="true"], [aria-selected="true"], [aria-current="page"], .is-active or .active: the soft
   accent fill with accent text, weight 500, no outline (design-system README, rule 4). The segmented group follows the
   component library: an outlined 32px track with no inner padding, items 4px-rounded and 1px in. */
.lt-segmented { display: inline-flex; align-items: stretch; gap: 0; padding: 0; border: 1px solid var(--lt-seg-track-line); border-radius: var(--radius-md); background: var(--lt-seg-track) }
.lt-segmented .lt-seg-item { justify-content: center; min-height: 30px; border-radius: var(--radius-sm); background-clip: padding-box }
.lt-seg-item, .lt-chip, .lt-list-item { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: var(--radius-md); color: var(--lt-muted); background: transparent; font-family: var(--lt-font); font-size: 13px; font-weight: 500; line-height: 1.2; white-space: nowrap; cursor: pointer; transition: var(--lt-transition) }
.lt-chip { border-color: var(--lt-line); background: var(--lt-surface) }
/* Small chip for dense rows (list metadata, inline counts). */
.lt-chip.lt-chip-sm { gap: 4px; min-height: 24px; padding: 0 8px; font-size: 12px }
/* Buttons inside a menu (.lt-menu) read left to right, full width. */
.lt-menu .lt-btn { justify-content: flex-start; width: 100% }
.lt-list-item { display: flex; width: 100%; min-height: 36px; justify-content: space-between; font-size: 14px }
.lt-seg-item:hover:not(:disabled), .lt-chip:hover:not(:disabled), .lt-list-item:hover:not(:disabled) { color: var(--lt-text); background: var(--lt-hover-tint) }
.lt-seg-item:active:not(:disabled), .lt-chip:active:not(:disabled), .lt-list-item:active:not(:disabled) { background: var(--lt-press-tint) }
:is(.lt-seg-item, .lt-chip, .lt-list-item):is([aria-pressed="true"], [aria-selected="true"], [aria-current="page"], .is-active, .active) { color: var(--accent-foreground); background: var(--selected); font-weight: 500 }
.lt-count { color: inherit; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; opacity: .75 }
.lt-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--lt-line) }
.lt-tab { position: relative; min-height: 44px; padding: 0 12px; border: 0; border-radius: var(--radius-md) var(--radius-md) 0 0; color: var(--lt-muted); background: transparent; font-family: var(--lt-font); font-size: 14px; font-weight: 500; line-height: 1.2; cursor: pointer; transition: var(--lt-transition) }
.lt-tab:hover { color: var(--lt-text); background: var(--lt-hover-tint) }
.lt-tab:is([aria-pressed="true"], [aria-selected="true"], .is-active, .active) { color: var(--accent-foreground); background: transparent; font-weight: 500 }
.lt-tab:is([aria-pressed="true"], [aria-selected="true"], .is-active, .active)::after { position: absolute; right: 12px; bottom: -1px; left: 12px; height: 2px; border-radius: var(--radius-sm); background: var(--lt-brand-strong); content: "" }

/* Interactive card, e.g. a metric that filters on click. */
.lt-card-btn { border: 1px solid var(--lt-line); border-radius: var(--radius-lg); color: var(--lt-text); background: var(--lt-surface); text-align: left; cursor: pointer; transition: var(--lt-transition) }
.lt-card-btn:hover { border-color: var(--lt-btn-hover-line); background: var(--lt-btn-hover-bg) }

/* Fields: inputs and selects share the button height. */
.lt-field { min-height: var(--lt-control-height); padding: 0 12px; border: 1px solid var(--lt-line-strong); border-radius: var(--radius-md); color: var(--lt-text); background: var(--lt-surface); font-family: var(--lt-font); font-size: 14px; font-weight: 400; line-height: 1.4; transition: var(--lt-transition) }
.lt-field:hover { border-color: var(--lt-btn-hover-line) }
.lt-field:focus { border-color: var(--kit-focus); outline: none; box-shadow: var(--lt-focus-halo) }
.lt-field::placeholder { color: var(--lt-muted) }
/* Selects drop the native arrow for a chevron drawn with two gradient strokes: Todo/Blog CSP
   blocks data: images, and gradients let the chevron follow the hover/focus color. */

<script type="module">
// Browser code shared by the Portal Panel and the public site; page.ts inlines this file as one module script, so the
// functions tested in Node are the ones that run. Boot data comes from <script type="application/json" id="starsieve-boot">:
// { mode: "panel" | "site", lang: "en" | "zh" | "auto", dict, base, token, readOnly, data? }.
// The Panel fetches its data from `${base}/api/state` and writes through `${base}/api/override` and `/api/unskip`
// (the same core functions as `starsieve override`); the site has its data inline and never writes.
// Styling comes only from /_shared/local-tools.css classes (.lt-*) and tokens; every string is escaped before use.

export const NONE = 'starsieve:not-classified'

export function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
}

/** English is the key; `dict` holds the Chinese. `{name}` placeholders are filled from `vars`. */
export function makeT(dict) {
  return (s, vars) => {
    let out = (dict && dict[s]) || s
    if (vars) for (const [k, v] of Object.entries(vars)) out = out.split(`{${k}}`).join(String(v))
    return out
  }
}

/** Where an Item may link: its GitHub repository or its post on X. Anything else is shown as plain text. */
const LINK_HOSTS = new Set(['github.com', 'x.com', 'twitter.com'])

/** The Item's url when it is an https link to github.com, x.com or twitter.com; otherwise null (rendered without a link). */
export function safeUrl(url) {
  let u
  try {
    u = new URL(String(url ?? ''))
  } catch {
    return null
  }
  // `host` keeps the port, so https://github.com:8443/ is refused too.
  if (u.protocol !== 'https:' || !LINK_HOSTS.has(u.host) || u.username || u.password) return null
  return u.href
}

export function compact(n) {
  if (typeof n !== 'number') return ''
  if (n >= 1e6) return `${(n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '')}M`
  if (n >= 1e3) return `${(n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '')}k`
  return String(n)
}

/** The filters: source `all|github|x`, category (NONE = not classified), status (`review`, or absent for any), tag,
 * search text. */
export function matches(item, f) {
  if (f.source !== 'all' && item.source !== f.source) return false
  if (f.category !== null) {
    if (f.category === NONE ? item.category !== null : item.category !== f.category) return false
  }
  if (f.status === 'review' && !item.needsReview) return false
  if (f.tag !== null && !item.tags.includes(f.tag)) return false
  if (f.q) {
    const hay = [item.title, item.summary, item.description, item.category, item.text, item.language, ...item.tags]
      .filter(Boolean)
      .join('\n')
      .toLowerCase()
    if (!f.q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w))) return false
  }
  return true
}

/** `recent`: newest saved first. `stars`: most stars first; Items without a star count last, newest first. */
export function sortItems(items, sort) {
  const recent = (a, b) => (a.addedAt < b.addedAt ? 1 : a.addedAt > b.addedAt ? -1 : a.key < b.key ? -1 : 1)
  const list = [...items]
  if (sort === 'stars') {
    return list.sort((a, b) => {
      const sa = typeof a.stars === 'number' ? a.stars : -1
      const sb = typeof b.stars === 'number' ? b.stars : -1
      return sb - sa || recent(a, b)
    })
  }
  return list.sort(recent)
}

/** Category chips: the Category Table's order, then Categories only found on Items, then "not classified". */
export function categoryCounts(items, order) {
  const counts = new Map()
  for (const item of items) {
    const key = item.category === null ? NONE : item.category
    counts.set(key, (counts.get(key) ?? 0) + 1)
  }
  const out = []
  for (const name of order) if (counts.has(name)) out.push([name, counts.get(name)])
  const extra = [...counts.keys()].filter((k) => k !== NONE && !order.includes(k)).sort()
  for (const name of extra) out.push([name, counts.get(name)])
  if (counts.has(NONE)) out.push([NONE, counts.get(NONE)])
  return out
}

/** The most used Tags, most first, then by name. */
export function tagCounts(items, limit) {
  const counts = new Map()
  for (const item of items) for (const tag of item.tags) counts.set(tag, (counts.get(tag) ?? 0) + 1)
  return [...counts].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).slice(0, limit)
}

function signalLabel(item, t) {
  if (item.source === 'github') return 'GitHub'
  const names = (item.signals ?? []).map((s) => (s === 'like' ? t('Like') : s === 'bookmark' ? t('Bookmark') : s))
  return names.length ? `X · ${names.join(' · ')}` : 'X'
}

/** How many Tags a row shows: the first (the kind of thing) and at most two topics. The rest sit in a tooltip. */
export const ROW_TAGS = 3

// Octicons star-fill, link-external and x (MIT), drawn in currentColor so they follow the theme.
const STAR_SVG =
  '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>'
const LINK_SVG =
  '<svg class="ext" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.854-1h4.146a.25.25 0 0 1 .25.25v4.146a.25.25 0 0 1-.427.177L13.03 4.03 9.28 7.78a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l3.75-3.75-1.543-1.543A.25.25 0 0 1 10.604 1Z"/></svg>'
export const X_SVG =
  '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>'

/** One compact row. `ctx`: { t, mode, editable, tag }. Only the Chinese Summary is shown; the GitHub description moves
 * into its tooltip, and stands in only while there is no Summary. */
export function cardHtml(item, ctx) {
  const { t } = ctx
  const panel = ctx.mode === 'panel'
  const badges = []
  // Most Items wait for the Classifier at first, so only Needs review is a warning.
  // The title link carries the accent; the Category stays a neutral label, and "not classified" is only outlined.
  if (item.category === null) badges.push(`<span class="lt-badge is-outline">${esc(t('Not classified'))}</span>`)
  else badges.push(`<span class="lt-badge item-cat">${esc(item.category)}</span>`)
  if (item.needsReview) {
    badges.push(`<span class="lt-badge is-warn" data-tip="${esc(t('The Classifier was not sure about this one'))}">${esc(t('Needs review'))}</span>`)
  }
  // Public is what a classified Item usually is, so only the exception is marked.
  if (panel && item.visibility === 'private' && !item.repoPrivate) {
    badges.push(`<span class="lt-badge" data-tip="${esc(t('Never published'))}">${esc(t('Private'))}</span>`)
  }
  if (panel && item.repoPrivate) {
    badges.push(`<span class="lt-badge" data-tip="${esc(t('A private repository is never published'))}">${esc(t('Private repository'))}</span>`)
  }
  if (panel && item.locked) {
    badges.push(`<span class="lt-badge is-outline" data-tip="${esc(t('Changed by hand; the Classifier never overwrites it'))}">${esc(t('Locked'))}</span>`)
  }
  if (item.archived) badges.push(`<span class="lt-badge">${esc(t('Archived'))}</span>`)

  let text
  if (item.summary) {
    const tip = item.description ? ` data-tip="${esc(item.description)}"` : ''
    text = `<p class="summary"${tip}>${esc(item.summary)}</p>`
  } else if (item.description) text = `<p class="summary is-fallback" data-tip="${esc(item.description)}">${esc(item.description)}</p>`
  else if (panel && item.text) text = `<p class="summary is-fallback">${esc(item.text)}</p>`
  else text = `<p class="summary is-fallback">${esc(item.source === 'x' && panel ? t('No post text was saved') : t('No summary yet'))}</p>`

  const meta = []
  if (item.language) meta.push(`<span>${esc(item.language)}</span>`)
  if (typeof item.stars === 'number') meta.push(`<span class="stars">${STAR_SVG}${esc(compact(item.stars))}</span>`)
  if (item.addedAt) {
    const date = item.addedAt.slice(0, 10)
    meta.push(`<time datetime="${esc(date)}" data-tip="${esc(t('Added {date}', { date }))}">${esc(date)}</time>`)
  }

  const shown = item.tags.slice(0, ROW_TAGS)
  const rest = item.tags.slice(ROW_TAGS)
  const tags =
    shown
      .map(
        (tag) =>
          `<button type="button" class="lt-chip lt-chip-sm" data-tag="${esc(tag)}" aria-pressed="${ctx.tag === tag ? 'true' : 'false'}">${esc(tag)}</button>`,
      )
      .join('') + (rest.length ? `<span class="more" data-tip="${esc(rest.join(', '))}">+${rest.length}</span>` : '')
  // Panel only: the post text saved for an X Item, folded under the row until its toggle opens it. The site never has it.
  const fullId = `full-${String(item.key).replace(/[^A-Za-z0-9_-]/g, '_')}`
  const full = panel && item.text ? `<p class="fulltext" id="${esc(fullId)}" hidden>${esc(item.text)}</p>` : ''
  const toggle = full
    ? `<button type="button" class="lt-btn-link" data-fulltext aria-expanded="false" aria-controls="${esc(fullId)}">${esc(t('Saved post text'))}</button>`
    : ''
  const href = safeUrl(item.url)
  const title = href
    ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" data-open>${esc(item.title)}${LINK_SVG}<span class="sr-only">${esc(t('(opens in a new tab)'))}</span></a>`
    : `<span>${esc(item.title)}</span>`
  const edit = ctx.editable
    ? `<button type="button" class="lt-btn lt-btn-ghost lt-btn-sm" data-edit aria-label="${esc(t('Edit {name}', { name: item.title }))}">${esc(t('Edit'))}</button>`
    : ''
  return `<div class="item-head"><h3>${title}</h3><span class="src">${esc(signalLabel(item, t))}</span>${badges.join('')}</div>
<div class="item-meta">${toggle}${meta.join('<span aria-hidden="true">·</span>')}${edit}</div>
${text}
${tags ? `<div class="item-labels">${tags}</div>` : ''}
${full}`
}

/** The edit form inside a card; fields mirror `starsieve override` options. */
export function editFormHtml(item, ctx) {
  const { t } = ctx
  const cats = ctx.categories.includes(item.category ?? '') || item.category === null ? ctx.categories : [item.category, ...ctx.categories]
  const options = cats
    .map((c) => `<option value="${esc(c)}"${c === item.category ? ' selected' : ''}>${esc(c)}</option>`)
    .join('')
  const none = item.category === null ? `<option value="" selected>${esc(t('Not classified'))}</option>` : ''
  const vis = item.visibility ?? 'private'
  return `<form class="edit" data-edit-form>
<h3>${esc(item.title)}</h3>
<label>${esc(t('Category'))}<select class="lt-field" name="category">${none}${options}</select></label>
<label>${esc(t('Tags'))}<input class="lt-field" name="tags" value="${esc(item.tags.join(', '))}" placeholder="${esc(t('Comma separated, at most 6'))}" autocomplete="off"></label>
<label>${esc(t('Summary'))}<textarea class="lt-field" name="summary" rows="3" maxlength="80">${esc(item.summary)}</textarea></label>
<label>${esc(t('Visibility'))}<select class="lt-field" name="visibility"><option value="public"${vis === 'public' ? ' selected' : ''}>${esc(t('Public'))}</option><option value="private"${vis === 'private' ? ' selected' : ''}>${esc(t('Private'))}</option></select></label>
${item.repoPrivate ? `<p class="note">${esc(t('A private repository is never published'))}</p>` : ''}
<p class="note">${esc(t('Saving locks it: the Classifier never overwrites it.'))}</p>
<div class="item-actions"><button type="submit" class="lt-btn lt-btn-sm lt-btn-primary">${esc(t('Save'))}</button><button type="button" class="lt-btn lt-btn-sm" data-cancel>${esc(t('Cancel'))}</button></div>
</form>`
}

/** What the edit form changes, as `override` options; only the fields that differ. */
export function formChange(item, form) {
  const change = {}
  const category = form.category
  if (category && category !== item.category) change.category = category
  const tags = String(form.tags ?? '')
    .split(/[,，]/)
    .map((s) => s.trim())
    .filter(Boolean)
  if (tags.join('\n') !== item.tags.join('\n')) change.tags = tags
  const summary = String(form.summary ?? '').trim()
  if (summary !== item.summary) change.summary = summary
  if (form.visibility && form.visibility !== (item.visibility ?? 'private')) change.visibility = form.visibility
  return change
}

function stateHtml(title, body, actions) {
  return `<div class="state" role="status"><h2>${esc(title)}</h2>${body}${actions ?? ''}</div>`
}

function boot() {
  const bootEl = document.getElementById('starsieve-boot')
  const cfg = JSON.parse(bootEl.textContent)
  let dict = cfg.dict
  if (cfg.lang === 'auto') {
    const zh = /^zh\b/i.test(navigator.language || '')
    dict = zh ? cfg.dicts.zh : {}
    document.documentElement.lang = zh ? 'zh-CN' : 'en'
  }
  const t = makeT(dict)
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n)
  const panel = cfg.mode === 'panel'
  const $ = (sel) => document.querySelector(sel)
  const main = $('#main')
  const toastEl = $('#toast')
  let toastTimer = 0

  const S = { source: 'all', category: null, status: null, tag: null, q: '', sort: 'recent', view: 'items' }
  let data = null
  let editable = false
  let sortedBy = null
  const nodes = new Map()

  function toast(text, error) {
    toastEl.textContent = text
    toastEl.classList.toggle('is-error', Boolean(error))
    toastEl.hidden = false
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => (toastEl.hidden = true), error ? 8000 : 4000)
  }

  async function post(path, body, retried) {
    const res = await fetch(`${cfg.base}${path}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-starsieve-token': cfg.token },
      body: JSON.stringify(body),
    })
    const json = await res.json().catch(() => ({}))
    // The Panel was restarted since this page loaded: take its new token and try once more.
    if (res.status === 403 && json.error?.code === 'bad-token' && !retried) {
      const fresh = await fetch(`${cfg.base}/api/token`).then((r) => (r.ok ? r.json() : null)).catch(() => null)
      if (fresh?.token) {
        cfg.token = fresh.token
        return post(path, body, true)
      }
    }
    if (!res.ok || json.ok === false) throw new Error(json.error?.message || `HTTP ${res.status}`)
    return json
  }

  const ctx = () => ({ t, mode: cfg.mode, editable, tag: S.tag, categories: data.categories })
  const bySource = () => data.items.filter((i) => S.source === 'all' || i.source === S.source)

  function layout() {
    const tabs = panel
      ? `<nav class="lt-tabs" role="tablist" aria-label="${esc(t('Views'))}">
<a class="lt-tab" role="tab" href="#items" data-view="items">${esc(t('Items'))}</a>
<a class="lt-tab" role="tab" href="#skipped" data-view="skipped">${esc(t('Skipped'))} <span class="lt-count" id="skipped-count"></span></a>
</nav>`
      : ''
    const sources = [
      ['all', t('All')],
      ['github', 'GitHub'],
      ['x', 'X'],
    ]
      .map(([v, label]) => `<button type="button" class="lt-seg-item" data-source="${v}">${esc(label)} <span class="lt-count" data-source-count="${v}"></span></button>`)
      .join('')
    const hasStars = data.items.some((i) => typeof i.stars === 'number')
    const sort = `<select class="lt-field" id="sort" aria-label="${esc(t('Sort'))}"><option value="recent">${esc(t('Recently added'))}</option>${hasStars ? `<option value="stars">${esc(t('Most stars'))}</option>` : ''}</select>`
    $('#top').innerHTML = tabs
    main.innerHTML = `<section class="view" id="view-items">
<div class="shell">
<aside class="side" id="side" aria-label="${esc(t('Filters'))}">
<div class="side-group"><h2 class="side-h" id="cats-h">${esc(t('Category'))}</h2><div class="side-list" id="cats" role="group" aria-labelledby="cats-h"></div></div>
${panel ? `<div class="side-group" id="states-wrap"><h2 class="side-h" id="states-h">${esc(t('Status'))}</h2><div class="side-list" id="states" role="group" aria-labelledby="states-h"></div></div>` : ''}
<div class="side-group side-tags" id="tags-wrap"><h2 class="side-h" id="tags-h">${esc(t('Tags'))}</h2><div class="side-chips" id="tags" role="group" aria-labelledby="tags-h"></div></div>
${panel ? '<div class="side-group side-reach" id="reach"></div>' : ''}
</aside>
<div class="content">
<div class="toolbar">
<div class="lt-segmented" role="group" aria-label="${esc(t('Source'))}">${sources}</div>
<input class="lt-field" type="search" id="q" placeholder="${esc(t('Search names, summaries and tags (press /)'))}" aria-label="${esc(t('Search'))}" autocomplete="off">
${sort}
</div>
<div class="list-head" id="status" aria-live="polite"></div>
<div class="list" id="grid"></div>
<div id="nomatch" hidden></div>
</div>
</div>
</section>
${panel ? '<section class="view" id="view-skipped" hidden></section>' : ''}`
    const grid = $('#grid')
    nodes.clear()
    sortedBy = null
    for (const item of data.items) {
      const el = document.createElement('article')
      el.className = 'item'
      el.dataset.key = item.key
      el.innerHTML = cardHtml(item, ctx())
      nodes.set(item.key, el)
      grid.append(el)
    }
  }

  /** The side column: Categories, then the two states (Panel), the most used Tags, and the X backfill (Panel). */
  function renderFacets() {
    const base = bySource()
    const cats = categoryCounts(base, data.categories)
    const row = (attr, value, label, n, on) =>
      `<button type="button" class="lt-list-item" ${attr}="${esc(value)}" aria-pressed="${on ? 'true' : 'false'}"><span class="side-name">${esc(label)}</span><span class="lt-count">${n}</span></button>`
    const chip = (value, n, on) =>
      `<button type="button" class="lt-chip lt-chip-sm" data-tag="${esc(value)}" aria-pressed="${on ? 'true' : 'false'}">${esc(value)} <span class="lt-count">${n}</span></button>`
    const side = $('#side')
    const active = document.activeElement && side.contains(document.activeElement) ? document.activeElement : null
    const focusKey = active ? ['cat', 'status', 'tag'].find((k) => active.dataset[k] !== undefined) : undefined
    const focusVal = focusKey ? active.dataset[focusKey] : undefined

    $('#cats').innerHTML =
      row('data-cat', '', t('All categories'), base.length, S.category === null) +
      cats
        .filter(([name]) => name !== NONE)
        .map(([name, n]) => row('data-cat', name, name, n, S.category === name))
        .join('')
    const states = $('#states')
    if (states) {
      const pending = cats.find(([name]) => name === NONE)?.[1] ?? 0
      const review = base.filter((i) => i.needsReview).length
      states.innerHTML =
        (pending ? row('data-cat', NONE, t('Not classified'), pending, S.category === NONE) : '') +
        (review ? row('data-status', 'review', t('Needs review'), review, S.status === 'review') : '')
      $('#states-wrap').hidden = !pending && !review
    }
    const inCat = base.filter((i) => S.category === null || (S.category === NONE ? i.category === null : i.category === S.category))
    const tags = tagCounts(inCat, 12)
    if (S.tag !== null && !tags.some(([name]) => name === S.tag)) tags.unshift([S.tag, inCat.filter((i) => i.tags.includes(S.tag)).length])
    $('#tags').innerHTML = tags.map(([name, n]) => chip(name, n, S.tag === name)).join('')
    $('#tags-wrap').hidden = !tags.length
    if (focusKey) side.querySelector(`[data-${focusKey}="${CSS.escape(focusVal)}"]`)?.focus()

    for (const v of ['all', 'github', 'x']) {
      const n = v === 'all' ? data.items.length : data.items.filter((i) => i.source === v).length
      const el = document.querySelector(`[data-source-count="${v}"]`)
      if (el) el.textContent = String(n)
      document.querySelector(`[data-source="${v}"]`)?.setAttribute('aria-pressed', String(S.source === v))
    }
  }

  function renderStatus(shown) {
    const parts = [`<span>${esc(t('{shown} of {total} Items', { shown, total: data.items.length }))}</span>`]
    if (S.tag !== null) {
      parts.push(
        `<button type="button" class="lt-chip lt-chip-sm" data-tag="${esc(S.tag)}" aria-pressed="true" aria-label="${esc(t('Remove Tag filter {name}', { name: S.tag }))}">${esc(S.tag)}${X_SVG}</button>`,
      )
    }
    if (S.source !== 'all' || S.category !== null || S.status !== null || S.tag !== null || S.q !== '') {
      parts.push(`<button type="button" class="lt-btn-link" data-clear>${esc(t('Clear filters'))}</button>`)
    }
    $('#status').innerHTML = parts.join('')
    const reach = $('#reach')
    if (reach) {
      const lines = (data.reach ?? []).map((r) => {
        const list = r.signal === 'like' ? t('Likes') : t('Bookmarks')
        const text = r.earliestPostedAt
          ? t('{list} backfill: {seen} read, back to {date}', { list, seen: r.seen, date: r.earliestPostedAt.slice(0, 10) })
          : t('{list} backfill: {seen} read', { list, seen: r.seen })
        const end = r.reachedEnd ? t('reached the end') : r.finished ? t('stopped before the end') : t('interrupted')
        return `<p data-tip="${esc(t('X lists are not ordered by post time, so completeness stays unknown'))}">${esc(text)} <span class="lt-badge ${r.reachedEnd ? 'is-ok' : 'is-warn'}">${esc(end)}</span></p>`
      })
      reach.innerHTML = lines.join('')
      reach.hidden = !lines.length
    }
  }

  function apply() {
    const visible = []
    for (const item of data.items) {
      const on = matches(item, S)
      nodes.get(item.key).hidden = !on
      if (on) visible.push(item)
    }
    const grid = $('#grid')
    if (sortedBy !== S.sort) {
      // Move the existing cards rather than rebuilding them, so focus and an open edit form survive.
      for (const item of sortItems(data.items, S.sort)) {
        const el = nodes.get(item.key)
        if (grid.moveBefore) grid.moveBefore(el, null)
        else grid.append(el)
      }
      sortedBy = S.sort
    }
    for (const b of grid.querySelectorAll('[data-tag]')) b.setAttribute('aria-pressed', String(b.dataset.tag === S.tag))
    // One Category chosen: every row would repeat its name, so the rows drop that badge.
    grid.toggleAttribute('data-one-category', S.category !== null && S.category !== NONE)
    grid.hidden = visible.length === 0
    renderFacets()
    renderStatus(visible.length)
    const nomatch = $('#nomatch')
    const filtered = S.source !== 'all' || S.category !== null || S.status !== null || S.tag !== null || S.q !== ''
    nomatch.hidden = visible.length > 0
    nomatch.innerHTML =
      visible.length > 0
        ? ''
        : stateHtml(
            t('No Items match'),
            `<p>${esc(t('Try another word, or clear the filters.'))}</p>`,
            filtered ? `<button type="button" class="lt-btn" data-clear>${esc(t('Clear filters'))}</button>` : '',
          )
  }

  function renderSkipped() {
    const el = $('#view-skipped')
    if (!el) return
    $('#skipped-count').textContent = String(data.skipped.length)
    if (!data.skipped.length) {
      el.innerHTML = stateHtml(t('No Skipped Items'), `<p>${esc(t('Posts the Classifier judges not technical are listed here by id.'))}</p>`)
      return
    }
    const rows = data.skipped
      .map(
        (s) => `<li class="row" data-skipped="${esc(s.id)}">
${safeUrl(s.url) ? `<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.id)}</a>` : `<span>${esc(s.id)}</span>`}
<span class="meta">${esc(t('Skipped {date}', { date: s.skippedAt.slice(0, 10) }))}</span>
${editable ? `<button type="button" class="lt-btn lt-btn-sm" data-unskip="${esc(s.id)}" data-tip="${esc(t('The next X collection stores it again as pending'))}">${esc(t('Unskip'))}</button>` : ''}
</li>`,
      )
      .join('')
    el.innerHTML = `<p class="note">${esc(t('Only the id of a Skipped Item is kept, so it is never judged, shown or published. Unskip brings it back with the next X collection.'))}</p><ul class="rows">${rows}</ul>`
  }

  function showView() {
    const view = panel && location.hash === '#skipped' ? 'skipped' : 'items'
    S.view = view
    for (const a of document.querySelectorAll('[data-view]')) {
      const on = a.dataset.view === view
      a.setAttribute('aria-selected', String(on))
      if (on) a.setAttribute('aria-current', 'page')
      else a.removeAttribute('aria-current')
    }
    $('#view-items').hidden = view !== 'items'
    const sk = $('#view-skipped')
    if (sk) sk.hidden = view !== 'skipped'
  }

  function render() {
    layout()
    renderSkipped()
    showView()
    apply()
  }

  function emptyStore() {
    main.innerHTML = panel
      ? stateHtml(
          t('Nothing collected yet'),
          `<p>${esc(t('Collect your GitHub stars, then sort them:'))}</p><pre><code>pnpm starsieve collect github --store ${esc(cfg.storePath ?? '<store>')}
pnpm starsieve categories init --store ${esc(cfg.storePath ?? '<store>')}
pnpm starsieve classify --store ${esc(cfg.storePath ?? '<store>')}</code></pre>`,
        )
      : stateHtml(t('Nothing public yet'), `<p>${esc(t('Items appear here once they are classified as public.'))}</p>`)
  }

  async function load() {
    $('#top').innerHTML = ''
    if (!panel) {
      data = cfg.data
      if (!data.items.length) return emptyStore()
      return render()
    }
    main.innerHTML = stateHtml(t('Loading…'), `<p>${esc(t('Reading the store.'))}</p>`)
    let state
    try {
      const res = await fetch(`${cfg.base}/api/state`, { headers: { accept: 'application/json' } })
      state = await res.json()
      if (!res.ok && !state.status) throw new Error(state.error?.message || `HTTP ${res.status}`)
    } catch (e) {
      main.innerHTML = stateHtml(
        t('Could not load Stars'),
        `<p>${esc(String(e.message || e))}</p><p>${esc(t('Check that the Portal is running, then retry.'))}</p>`,
        `<button type="button" class="lt-btn lt-btn-primary" data-retry>${esc(t('Retry'))}</button>`,
      )
      return
    }
    cfg.storePath = state.storePath
    editable = !state.readOnly
    if (state.status === 'unconfigured') {
      main.innerHTML = stateHtml(
        t('No store set up'),
        `<p>${esc(t('Tell the Panel where your Private Store is, in {path}:', { path: state.configPath }))}</p><pre><code>${esc('{ "storePath": "~/path/to/stars-private" }')}</code></pre><p>${esc(t('Then reload this page.'))}</p>`,
        `<button type="button" class="lt-btn" data-retry>${esc(t('Reload'))}</button>`,
      )
      return
    }
    if (state.status === 'error') {
      main.innerHTML = stateHtml(
        t('Could not read the store'),
        `<p>${esc(state.error?.message ?? '')}</p>${state.next ? `<p>${esc(t('Next step:'))} <code>${esc(state.next)}</code></p>` : ''}`,
        `<button type="button" class="lt-btn lt-btn-primary" data-retry>${esc(t('Retry'))}</button>`,
      )
      return
    }
    data = state.data
    if (!data.items.length && !data.skipped.length) return emptyStore()
    render()
  }

  function rerenderCard(key) {
    const item = data.items.find((i) => i.key === key)
    const el = nodes.get(key)
    if (item && el) el.innerHTML = cardHtml(item, ctx())
  }

  document.addEventListener('click', async (e) => {
    const target = e.target.closest('button, a[data-view]')
    if (!target) {
      // A click anywhere else on a row opens it like its title link; links, buttons, the post text and the edit form
      // keep their own clicks, and selecting text does not open anything.
      const row = e.target.closest('.item')
      if (!row || e.target.closest('a, .fulltext, form, input, select, textarea, label')) return
      if (String(window.getSelection?.() ?? '')) return
      row.querySelector('a[data-open]')?.click()
      return
    }
    if (target.dataset.retry !== undefined) return load()
    if (target.dataset.clear !== undefined) {
      Object.assign(S, { source: 'all', category: null, status: null, tag: null, q: '' })
      $('#q').value = ''
      return apply()
    }
    if (target.dataset.source) {
      S.source = target.dataset.source
      S.category = null
      S.status = null
      S.tag = null
      return apply()
    }
    if (target.dataset.cat !== undefined) {
      S.category = target.dataset.cat === '' ? null : target.dataset.cat
      // Not classified and Needs review never overlap: an Item waiting for review already has a Category.
      if (S.category === NONE) S.status = null
      S.tag = null
      return apply()
    }
    if (target.dataset.status !== undefined) {
      S.status = S.status === target.dataset.status ? null : target.dataset.status
      if (S.category === NONE) S.category = null
      return apply()
    }
    if (target.dataset.tag !== undefined) {
      S.tag = S.tag === target.dataset.tag ? null : target.dataset.tag
      return apply()
    }
    if (target.dataset.fulltext !== undefined) {
      const open = target.getAttribute('aria-expanded') !== 'true'
      target.setAttribute('aria-expanded', String(open))
      const p = document.getElementById(target.getAttribute('aria-controls'))
      if (p) p.hidden = !open
      return
    }
    if (target.dataset.edit !== undefined) {
      const el = target.closest('[data-key]')
      const item = data.items.find((i) => i.key === el.dataset.key)
      el.innerHTML = editFormHtml(item, ctx())
      el.querySelector('select, input, textarea')?.focus()
      return
    }
    if (target.dataset.cancel !== undefined) {
      const key = target.closest('[data-key]').dataset.key
      rerenderCard(key)
      nodes.get(key).querySelector('[data-edit]')?.focus()
      return
    }
    if (target.dataset.unskip) {
      const id = target.dataset.unskip
      target.disabled = true
      try {
        await post('/api/unskip', { id })
        data.skipped = data.skipped.filter((s) => s.id !== id)
        renderSkipped()
        toast(t('{id} is no longer skipped. The next X collection stores it as pending.', { id }))
      } catch (err) {
        target.disabled = false
        toast(t('Could not unskip: {message}', { message: err.message }), true)
      }
    }
  })

  document.addEventListener('submit', async (e) => {
    const form = e.target.closest('[data-edit-form]')
    if (!form) return
    e.preventDefault()
    const el = form.closest('[data-key]')
    const item = data.items.find((i) => i.key === el.dataset.key)
    const values = Object.fromEntries(new FormData(form))
    const change = formChange(item, values)
    if (!Object.keys(change).length) {
      rerenderCard(item.key)
      return
    }
    for (const b of form.querySelectorAll('button')) b.disabled = true
    try {
      const r = await post('/api/override', { id: item.key, ...change })
      const c = r.classification
      Object.assign(item, {
        category: c.category,
        tags: c.tags,
        summary: c.summary,
        visibility: c.visibility,
        needsReview: c.needsReview,
        locked: c.locked,
      })
      rerenderCard(item.key)
      apply()
      toast(t('Saved and Locked: {name}', { name: item.title }))
    } catch (err) {
      for (const b of form.querySelectorAll('button')) b.disabled = false
      toast(t('Could not save: {message}', { message: err.message }), true)
    }
  })

  document.addEventListener('input', (e) => {
    if (e.target.id === 'q') {
      S.q = e.target.value.trim()
      apply()
    }
  })
  document.addEventListener('change', (e) => {
    if (e.target.id === 'sort') {
      S.sort = e.target.value
      apply()
    }
  })
  document.addEventListener('keydown', (e) => {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return
    const tag = document.activeElement?.tagName
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return
    const q = $('#q')
    if (q) {
      e.preventDefault()
      q.focus()
    }
  })
  window.addEventListener('hashchange', () => {
    if (data) showView()
  })

  load()
}

if (typeof document !== 'undefined') boot()

</script>
</body>
</html>
